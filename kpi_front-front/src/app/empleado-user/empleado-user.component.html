<app-home-usuario></app-home-usuario>
<div class="container">
    <h2 class="text-center mt-3">Informacion Empleados</h2>


    <table class="table table-hover rounded-circle">
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Apellido</th>
            <th scope="col">Area</th>
            <th scope="col">Cargo</th>
            <th scope="col" class="text-center">Funciones</th>

          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of empleados">
            <td>{{item.nombre}}</td>
             <td>{{item.apellido}}</td>
            <td>{{item.area?(item.area.nombreArea|json):"pending"}}</td>
            <td>{{item.cargo.nombreCargo|json}}</td>
            <td class="d-flex justify-content-center">
                <button class="btn  mx-1" (click)="EditEmpleadoAlert($event, item.id)"><i class="fa-solid fa-pen-to-square"></i></button>
                <button class="btn  mx-1" (click)="showDeleteAlert($event, item.id)"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
</div>
